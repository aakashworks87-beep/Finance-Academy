    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Safeguard against browser extensions monkey-patching window.fetch
      (function() {
        try {
          var origFetch = window.fetch;
          var customFetch = origFetch;
          var descriptor = {
            get: function() {
              return customFetch || origFetch;
            },
            set: function(fn) {
              customFetch = fn;
            },
            configurable: true,
            enumerable: true,
          };
          try {
            Object.defineProperty(window, 'fetch', descriptor);
          } catch (e1) {}
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              Object.defineProperty(Window.prototype, 'fetch', descriptor);
            }
          } catch (e2) {}
        } catch (err) {}

        window.addEventListener('error', function(event) {
          if (
            (event && event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
            (event && event.message && event.message.indexOf('fetch of #<Window>') !== -1)
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.onerror = function(msg, url) {
          if (
            (url && url.indexOf('chrome-extension://') !== -1) ||
            (typeof msg === 'string' && msg.indexOf('fetch of #<Window>') !== -1)
          ) {
            return true;
          }
        };
      })();
    </script>
