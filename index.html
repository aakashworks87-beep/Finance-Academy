    <script>
      // Safeguard against browser extensions monkey-patching window.fetch
      (function() {
        try {
          var originalFetch = window.fetch;
          var customFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return customFetch || originalFetch;
            },
            set: function(fn) {
              customFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {}
        window.addEventListener('error', function(event) {
          if (event && event.filename && event.filename.indexOf('chrome-extension://') !== -1) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
